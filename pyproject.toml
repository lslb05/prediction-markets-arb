[project]
name = "prediction-markets-arb"
version = "0.1.0"
description = "Cross-venue arbitrage surveillance for Kalshi and Polymarket: semantic matching of equivalent contracts and a point-in-time record of every spread observed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davi Liberato" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "polars>=1.8",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# Kept out of the default install on purpose: torch plus the two BGE
# checkpoints are ~3 GB. The encoder and the reranker are Protocols
# (matching/encoders.py), so tests and CI run against fakes and never
# download a model. Only the Airflow image installs this extra.
ml = [
    "sentence-transformers>=3.2",
    "torch>=2.4",
]

[project.scripts]
prediction-markets = "prediction_markets.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_markets"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Optional extra (see [project.optional-dependencies].ml): absent in CI by
# design, and the only import site is behind a factory function.
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=prediction_markets --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
