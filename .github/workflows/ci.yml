name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trader/package-lock.json

      - name: Sync Python dependencies
        run: uv sync --locked --dev

      - name: Install trader dependencies
        run: npm ci
        working-directory: trader

      # The same command that runs locally. The database tests bring up
      # Postgres through testcontainers, which uses the Docker daemon the
      # runner already provides.
      - name: Check
        run: uv run python scripts/check.py

  airflow-dags:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Catches the failure mode a unit test cannot: a DAG that imports
      # cleanly on a laptop and not inside the image Airflow actually runs.
      - name: Build Airflow image
        run: docker compose build airflow-init

      - name: Migrate metadata database
        run: docker compose up airflow-init

      - name: Check DAG import errors
        run: |
          docker compose run --rm airflow-scheduler airflow dags list-import-errors \
            | tee import_errors.txt
          ! grep -q '/opt/airflow/dags' import_errors.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
