x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://markets:markets@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Inside Compose's network Postgres answers on the usual 5432; the 5434
    # remap below is only on the host, to sit beside the other portfolio
    # databases already bound to 5432 and 5433.
    PREDICTION_MARKETS_POSTGRES_DSN: postgresql://markets:markets@postgres:5432/prediction_markets
    PREDICTION_MARKETS_DATA_DIR: /opt/airflow/data
    PREDICTION_MARKETS_KALSHI_KEY_ID: ${PREDICTION_MARKETS_KALSHI_KEY_ID:-}
    PREDICTION_MARKETS_KALSHI_PRIVATE_KEY_PATH: /opt/airflow/secrets/kalshi.pem
    # Without this the checkpoints land on the container's writable layer and
    # are downloaded again -- three gigabytes -- every time the image is
    # rebuilt.
    HF_HOME: /opt/airflow/.cache/huggingface
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./secrets:/opt/airflow/secrets:ro
    - huggingface_cache:/opt/airflow/.cache/huggingface
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # pgvector rather than stock postgres: the schema declares a vector
    # column and an HNSW index, which a plain image cannot create.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: markets
      POSTGRES_PASSWORD: markets
      POSTGRES_DB: prediction_markets
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-airflow-db.sql:/docker-entrypoint-initdb.d/init-airflow-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markets -d prediction_markets"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin
        --firstname admin --lastname admin --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  huggingface_cache:
